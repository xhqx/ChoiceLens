[package]
name = "choicelens"
version = "0.1.4"
description = "A focused decision packet viewer"
edition = "2021"

[lib]
name = "choicelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
