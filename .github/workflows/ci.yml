name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace
